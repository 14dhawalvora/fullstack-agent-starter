# Test config: in-memory H2 so tests never touch the dev database file.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: WARN   # keep test output short; failures still show full assertion + stack
